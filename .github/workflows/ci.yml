# The gate from decision 0003, run on every push and pull request. Actions are pinned to full commit SHAs
# (tags can be moved); the comment beside each gives the release it was resolved from on 2026-11-14.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Tests, with the race detector
        run: go test -count=1 -race ./...
      - name: Census of protected tests
        run: go run ./cmd/census
      - name: Fuzz (30 seconds per target)
        # Decision 0031: a failing input fails the job at once. "context deadline exceeded" with no failing input
        # written is Go's fuzzing coordinator stopping mid-task at the time limit, not a finding, so it gets one retry.
        run: |
          set -o pipefail
          fuzz() {
            for attempt in 1 2; do
              if go test "./$1" -run='^$' -fuzz="^$2\$" -fuzztime=30s 2>&1 | tee fuzz.log; then
                return 0
              fi
              if grep -q 'Failing input written to' fuzz.log || ! grep -q 'context deadline exceeded' fuzz.log; then
                return 1
              fi
              echo "::warning::$1 $2 stopped at its deadline without a failing input; retrying once (decision 0031)"
            done
            return 1
          }
          for target in FuzzDecodeClaims FuzzVerifyMac0 FuzzVerifySign1 FuzzVerifyMessage; do fuzz cwt "$target"; done
          for target in FuzzCheckDeterministic FuzzDecodeClaims FuzzValidate FuzzNormalizeURI; do fuzz cat "$target"; done
          for target in FuzzParseItem FuzzFindInTarget; do fuzz cathttp "$target"; done
